<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Setup - Simple File Server</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2d3748;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 450px;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .icon {
            color: #667eea;
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        h1 {
            color: #2d3748;
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .subtitle {
            color: #718096;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 0.5rem;
        }

        label .material-icons {
            font-size: 1.2rem;
            color: #667eea;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.2s;
            background: white;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.875rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background-color: #fff5f5;
            color: #c53030;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #feb2b2;
            font-size: 0.9rem;
        }

        .info-box {
            background-color: #ebf4ff;
            color: #2c5282;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid #4299e1;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .password-hint {
            font-size: 0.8rem;
            color: #718096;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="material-icons icon">admin_panel_settings</span>
            <h1>Admin Setup</h1>
            <p class="subtitle">Create your administrator account</p>
        </div>

        <div class="info-box">
            Step 1 of 2: Create your admin credentials. You'll configure two-factor authentication on the next step.
        </div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>
                    <span class="material-icons">person</span>
                    Username
                </label>
                <input type="text" name="username" required autocomplete="username" autofocus>
            </div>

            <div class="form-group">
                <label>
                    <span class="material-icons">lock</span>
                    Password
                </label>
                <input type="password" name="password" required autocomplete="new-password" minlength="8">
                <div class="password-hint">Minimum 8 characters</div>
            </div>

            <div class="form-group">
                <label>
                    <span class="material-icons">lock</span>
                    Confirm Password
                </label>
                <input type="password" name="confirm_password" required autocomplete="new-password" minlength="8">
            </div>

            <button type="submit">
                <span class="material-icons">arrow_forward</span>
                Continue to Two-Factor Setup
            </button>
        </form>
    </div>
</body>
</html>
