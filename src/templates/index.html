<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2d3748;
            position: relative;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 90%;
            max-width: 450px;
            backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }

        .container:hover {
            transform: translateY(-2px);
        }

        h1 {
            color: #2d3748;
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 600;
        }

        .code-input {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .code-input input {
            width: 3.5rem;
            height: 3.5rem;
            font-size: 1.5rem;
            text-align: center;
            border: 2px solid #e2e8f0;
            border-radius: 0.75rem;
            background: white;
            outline: none;
            transition: all 0.2s;
        }

        .code-input input:focus {
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            align-items: center;
            width: 100%;
        }

        .download-button {
            flex: 1;
        }

        button {
            width: 100%;
            background-color: #4299e1;
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            background-color: #3182ce;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
            transform: none;
        }

        .delete-button {
            background-color: transparent;
            color: #718096;
            width: auto;
            padding: 0.75rem;
            transition: all 0.2s;
        }

        .delete-button:hover {
            color: #e53e3e;
            background-color: transparent !important;
            transform: scale(1.1);
        }

        .delete-button:disabled {
            color: #CBD5E0;
            background-color: transparent !important;
        }

        .delete-button i {
            font-size: 1.25rem;
        }

        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            text-align: center;
            display: none;
        }

        .message.error {
            background-color: #fff5f5;
            color: #c53030;
            border: 1px solid #feb2b2;
        }

        .message.success {
            background-color: #f0fff4;
            color: #2f855a;
            border: 1px solid #9ae6b4;
        }

        .spinner {
            display: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .version {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            font-size: 0.75rem;
            color: #718096;
            opacity: 0.8;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const inputs = document.querySelectorAll('.code-input input');
            const downloadButton = document.querySelector('.download-button');
            const deleteButton = document.querySelector('.delete-button');
            const spinner = document.querySelector('.spinner');
            const message = document.querySelector('.message');

            const showMessage = (text, type) => {
                message.textContent = text;
                message.className = 'message ' + type;
                message.style.display = 'block';
                setTimeout(() => {
                    message.style.display = 'none';
                }, 5000);
            };

            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    const value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
                    e.target.value = value;

                    if (value && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }

                    const isComplete = Array.from(inputs).every(input => input.value.length === 1);
                    downloadButton.disabled = !isComplete;
                    deleteButton.disabled = !isComplete;
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });

                // Allow pasting the entire code
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedText = e.clipboardData.getData('text').toUpperCase().replace(/[^A-Z0-9]/g, '');
                    
                    if (pastedText.length === 6) {
                        inputs.forEach((input, i) => {
                            input.value = pastedText[i] || '';
                        });
                        downloadButton.disabled = false;
                        deleteButton.disabled = false;
                    }
                });
            });

            deleteButton.addEventListener('click', async (e) => {
                e.preventDefault();
                const code = Array.from(inputs).map(input => input.value).join('');
                
                if (code.length !== 6) {
                    showMessage('Please enter a valid 6-character code.', 'error');
                    return;
                }

                if (!confirm('Are you sure you want to delete this file? This action cannot be undone.')) {
                    return;
                }

                downloadButton.disabled = true;
                deleteButton.disabled = true;
                spinner.style.display = 'block';
                const originalIcon = deleteButton.innerHTML;
                deleteButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

                try {
                    const response = await fetch(`/delete/${code}`, {
                        method: 'DELETE'
                    });
                    const data = await response.json();
                    
                    if (response.ok) {
                        showMessage('File deleted successfully!', 'success');
                        form.reset();
                    } else {
                        showMessage(data.error || 'Error deleting file. Please try again.', 'error');
                    }
                } catch (error) {
                    showMessage('Error deleting file. Please try again.', 'error');
                } finally {
                    setTimeout(() => {
                        downloadButton.disabled = false;
                        deleteButton.disabled = false;
                        spinner.style.display = 'none';
                        deleteButton.innerHTML = originalIcon;
                    }, 2000);
                }
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const code = Array.from(inputs).map(input => input.value).join('');
                
                if (code.length !== 6) {
                    showMessage('Please enter a valid 6-character code.', 'error');
                    return;
                }

                downloadButton.disabled = true;
                deleteButton.disabled = true;
                spinner.style.display = 'block';
                downloadButton.textContent = 'Downloading...';

                try {
                    window.location.assign(`/download/${code}`);
                    showMessage('Download started!', 'success');
                } catch (error) {
                    showMessage('Error starting download. Please try again.', 'error');
                } finally {
                    setTimeout(() => {
                        downloadButton.disabled = false;
                        deleteButton.disabled = false;
                        spinner.style.display = 'none';
                        downloadButton.textContent = 'Download';
                    }, 2000);
                }
            });
        });
    </script>
</head>
<body>
    <div class="container">
        <h1>Enter Your 6-Digit Code</h1>
        <form action="/download" method="GET">
            <div class="code-input">
                <input type="text" maxlength="1" required pattern="[A-Za-z0-9]" inputmode="text" autocomplete="off">
                <input type="text" maxlength="1" required pattern="[A-Za-z0-9]" inputmode="text" autocomplete="off">
                <input type="text" maxlength="1" required pattern="[A-Za-z0-9]" inputmode="text" autocomplete="off">
                <input type="text" maxlength="1" required pattern="[A-Za-z0-9]" inputmode="text" autocomplete="off">
                <input type="text" maxlength="1" required pattern="[A-Za-z0-9]" inputmode="text" autocomplete="off">
                <input type="text" maxlength="1" required pattern="[A-Za-z0-9]" inputmode="text" autocomplete="off">
            </div>
            <div class="button-group">
                <button type="submit" class="download-button" disabled>
                    Download
                    <div class="spinner"></div>
                </button>
                <button type="button" class="delete-button" disabled title="Delete file">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
            <div class="message"></div>
        </form>
    </div>
    <div class="version">v{{ version }}</div>
</body>
</html>
